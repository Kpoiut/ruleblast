name: Weird blast
description: Report a reproducible explanation, uncertainty, or grouping that misleads without being simply absent.
title: "[Blast Case] weird: "
labels:
  - bug
  - blast-case
body:
  - type: markdown
    attributes:
      value: |
        Weird means reproducible and hard to interpret. Keep the report to one path or one group.
  - type: dropdown
    id: surface_id
    attributes:
      label: Profile surface
      options:
        - openai/codex-cli@1
        - anthropic/claude-code-cli@1
        - cross-profile relation
    validations:
      required: true
  - type: input
    id: repository_url
    attributes:
      label: Public repository URL (optional)
      description: Leave blank for a fixture-only or privately reduced case.
  - type: input
    id: before_ref
    attributes:
      label: Immutable before ref (when public)
      description: Full commit object id for a public repository; leave blank for a fixture-only or privately reduced case.
  - type: input
    id: after_ref
    attributes:
      label: Immutable after ref (when public)
      description: Full commit object id for a public repository; leave blank for a fixture-only or privately reduced case.
  - type: input
    id: command
    attributes:
      label: Exact RuleBlast command and version
    validations:
      required: true
  - type: input
    id: focus_path
    attributes:
      label: One path or group root
    validations:
      required: true
  - type: input
    id: official_source_url
    attributes:
      label: Official evidence URL
    validations:
      required: true
  - type: input
    id: retrieval_date
    attributes:
      label: Evidence retrieval date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: before_manifest
    attributes:
      label: Minimal before manifest
      render: yaml
    validations:
      required: true
  - type: textarea
    id: after_manifest
    attributes:
      label: Minimal after manifest
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected_canonical_json
    attributes:
      label: Expected canonical JSON
      render: json
    validations:
      required: true
  - type: textarea
    id: observed_canonical_json
    attributes:
      label: Observed canonical JSON and text explanation
      description: Include both outputs when the wording is the problem.
    validations:
      required: true
  - type: textarea
    id: negative_control
    attributes:
      label: Smallest negative or boundary control
    validations:
      required: true
  - type: input
    id: surprise
    attributes:
      label: One-sentence surprise
    validations:
      required: true
  - type: checkboxes
    id: publication_permission
    attributes:
      label: Publication permission
      options:
        - label: I have permission to publish these reduced manifests, outputs, and links under the repository license.
          required: true
