name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: npm run package:smoke
      - run: npm run install:smoke
      - name: Verify published registry upgrade
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/tags/v2.1.1'
        env:
          RULEBLAST_REGISTRY_SMOKE: ruleblast@2.1.1
          RULEBLAST_REGISTRY_UPGRADE_FROM: ruleblast@1.5.1
        run: npm run install:smoke -- --registry
