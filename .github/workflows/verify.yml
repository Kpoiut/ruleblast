name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - name: Verify published registry upgrade
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/tags/v2.2.0'
        env:
          RULEBLAST_REGISTRY_SMOKE: ruleblast@2.2.0
          RULEBLAST_REGISTRY_UPGRADE_FROM: ruleblast@1.5.1
        run: npm run install:smoke -- --registry
