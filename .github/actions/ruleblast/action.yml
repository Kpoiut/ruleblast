name: RuleBlast
description: Comments the blast radius of AGENTS.md and CLAUDE.md on the pull-request runner.
author: Kpoiut
branding:
  icon: zap
  color: gray-dark
inputs:
  base:
    description: Base Git ref. Defaults to the pull request base SHA, else HEAD~1.
    required: false
    default: ""
  head:
    description: After Git ref. Defaults to the pull request head SHA, else HEAD.
    required: false
    default: ""
  version:
    description: Exact published package to run.
    required: false
    default: "2.4.5"
  reality:
    description: Optional extra modeled reality. github/copilot-cli@1 or google/gemini-cli@1. The published CLI also accepts both flags.
    required: false
    default: ""
  github-token:
    description: Token used only to post the pull request comment.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
    - name: Run RuleBlast receipt
      shell: bash
      env:
        RULEBLAST_BASE: ${{ inputs.base }}
        RULEBLAST_HEAD: ${{ inputs.head }}
        RULEBLAST_VERSION: ${{ inputs.version }}
        RULEBLAST_REALITY: ${{ inputs.reality }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        base="${RULEBLAST_BASE:-}"
        head="${RULEBLAST_HEAD:-}"
        if [ -z "$base" ]; then base="${PR_BASE:-HEAD~1}"; fi
        if [ -z "$head" ]; then head="${PR_HEAD:-HEAD}"; fi
        if [ -n "${RULEBLAST_REALITY:-}" ]; then
          npx --yes "ruleblast@${RULEBLAST_VERSION}" diff "$base" --to "$head" --receipt --reality "$RULEBLAST_REALITY" --color=never | tee "$GITHUB_WORKSPACE/ruleblast-receipt.txt"
        else
          npx --yes "ruleblast@${RULEBLAST_VERSION}" diff "$base" --to "$head" --receipt --color=never | tee "$GITHUB_WORKSPACE/ruleblast-receipt.txt"
        fi
    - name: Comment receipt
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        RULEBLAST_VERSION: ${{ inputs.version }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const body = fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/ruleblast-receipt.txt`, "utf8");
          const header = `RuleBlast \`${process.env.RULEBLAST_VERSION}\` receipt. Not a claim about model compliance.\n\n\`\`\`text\n`;
          const text = `${header}${body.trimEnd()}\n\`\`\`\n`;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const marker = "RuleBlast `";
          const existing = comments.find((comment) => comment.user?.type === "Bot" && comment.body?.startsWith(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: text,
            });
            return;
          }
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: text,
          });
